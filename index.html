<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绷金游戏记账系统</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:920px;margin:30px auto;padding:20px;background:#f5f7fa}
.box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0001;margin-bottom:15px}
input,button,select{padding:8px 12px;margin:5px;border:1px #ccc solid;border-radius:6px}
button{background:#3671e9;color:white;border:none;cursor:pointer}
.admin{background:#e8f3ff}
.hide{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px #ddd solid;padding:8px;text-align:center}
.redbtn{background:#e64340;}
.fresh-btn{background:#23a957;margin-bottom:8px;}
.in{color:#09943c;font-weight:bold}
.out{color:#e53935;font-weight:bold}
</style>
</head>
<body>
<h2>绷金游戏记账系统</h2>
<div class="box" id="loginBox">
    <h3>登录 / 注册</h3>
    <div>
        <input placeholder="账号" id="acc">
        <input placeholder="密码" type="password" id="pwd">
    </div>
    <button onclick="login()">登录</button>
    <button onclick="reg()">注册新账号</button>
</div>

<div class="box hide" id="mainBox">
    <h3>欢迎：<span id="nowUser"></span> | 当前绷金：<span id="myMoney">0</span></h3>
    <button class="fresh-btn" onclick="loadAllData()">一键刷新申请与余额</button>

    <div class="box">
        <h4>申请增加绷金（填写申请编号+自定义背面核验码，提交等待管理员批复）</h4>
        <input placeholder="填写申请编号" id="applyNo">
        <input placeholder="自由填写背面核验码" id="verifyCode">
        <button onclick="submitApply()">提交充值申请</button>
    </div>

    <div class="box">
        <h4>玩家转账（下拉显示对方余额）</h4>
        <select id="targetUser"></select>
        <input type="number" min="1" placeholder="转账绷金数量" id="transNum">
        <button onclick="doTransfer()">确认转账</button>
    </div>

    <div class="box">
        <h4>礼品兑换：5米（需要1000000绷金）</h4>
        <button class="redbtn" onclick="submitExchange()">申请兑换奖品</button>
        <p>提示：提交兑换立即暂扣绷金，管理员驳回自动原路退回</p>
    </div>

    <div class="box hide" id="allUserBox">
        <h4>全体玩家实时余额清单</h4>
        <div id="allUserTable"></div>
    </div>

    <div class="box">
        <h4>个人绷金收支明细（绿色入账｜红色出账）</h4>
        <div id="billList"></div>
    </div>

    <div class="box admin hide" id="adminPanel">
        <h4>待处理充值申请（编号+自定义核验码）</h4>
        <div id="applyBox"></div>
        <h4>待处理礼品兑换申请（已暂扣对应绷金）</h4>
        <div id="exchangeBox"></div>
        <h4>全部账号+明文密码+资产一览【仅管理员可见】</h4>
        <div id="adminAllUser"></div>
    </div>
    <button onclick="logout()">退出登录</button>
</div>

<script>
const KEY = "bjdata001";
let userData = {admin:{pwd:'123456',money:0}};
let applyData = [];
let exchangeData = [];
let billLog = [];
let currUser = '';
const NEED_EXCHANGE = 1000000;

async function getDb(){
  try{
    let res=await fetch('https://jsonblob.com/api/jsonBlob/1286474324591269888');
    let d=await res.json();
    userData=d.user;applyData=d.apply;exchangeData=d.exchange;billLog=d.bill;
  }catch{saveDb();}
}
async function saveDb(){
  let d={user:userData,apply:applyData,exchange:exchangeData,bill:billLog};
  fetch('https://jsonblob.com/api/jsonBlob/1286474325623158784',{
    method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)
  }).catch(e=>{});
}

function addBill(name,type,money,desc){
    let time=new Date().toLocaleString();
    billLog.push({user:name,type,num:money,info:desc,time});
    saveDb();
}

async function reg(){
    await getDb();
    let u=document.getElementById('acc').value.trim();
    let p=document.getElementById('pwd').value.trim();
    if(!u||!p)return alert('账号密码不能为空');
    if(userData[u])return alert('账号已存在');
    userData[u]={pwd:p,money:0};saveDb();alert('注册成功');
}

async function login(){
    await getDb();
    let u=document.getElementById('acc').value.trim();
    let p=document.getElementById('pwd').value.trim();
    if(!userData[u]||userData[u].pwd!==p)return alert('账号密码错误');
    currUser=u;
    document.getElementById('loginBox').classList.add('hide');
    document.getElementById('mainBox').classList.remove('hide');
    loadAllData();
}

async function loadAllData(){
    await getDb();
    document.getElementById('nowUser').innerText=currUser;
    document.getElementById('myMoney').innerText=userData[currUser].money;
    let sel=document.getElementById('targetUser');sel.innerHTML='';
    Object.keys(userData).forEach(n=>{
        if(n!==currUser){
            let o=document.createElement('option');
            o.textContent=`${n}（${userData[n].money}绷金）`;o.value=n;sel.appendChild(o);
        }
    })
    document.getElementById('allUserBox').classList.add('hide');
    let bh='';
    let my=billLog.filter(x=>x.user===currUser).reverse();
    my.forEach(d=>{
        let c=d.type=='in'?'in':'out';let s=d.type=='in'?'+':'-';
        bh+=`<p class="${c}">${d.time}｜${d.info}｜${s}${d.num}绷金</p>`;
    })
    document.getElementById('billList').innerHTML=bh||'暂无收支记录';
    if(currUser=='admin'){document.getElementById('adminPanel').classList.remove('hide');renderAdmin();}
    else{document.getElementById('adminPanel').classList.add('hide');}
}

function submitApply(){
    let n=document.getElementById('applyNo').value.trim();
    let c=document.getElementById('verifyCode').value.trim();
    if(!n||!c)return alert('信息不能为空');
    applyData.push({user:currUser,code:n,verify:c,id:Date.now()});saveDb();
    document.getElementById('applyNo').value='';document.getElementById('verifyCode').value='';
    alert('提交成功');
}
function submitExchange(){
    let m=userData[currUser].money;
    if(m<NEED_EXCHANGE)return alert('绷金不足');
    userData[currUser].money-=NEED_EXCHANGE;
    addBill(currUser,'out',NEED_EXCHANGE,'兑换暂扣');
    exchangeData.push({user:currUser,cost:NEED_EXCHANGE,id:Date.now()});
    saveDb();loadAllData();alert('兑换申请提交');
}

function renderAdmin(){
    let ah='';
    applyData.forEach((it,i)=>{
        ah+=`<p>申请人：${it.user}｜编号${it.code}｜核验${it.verify}
        <input id="in${i}" placeholder="填写数额" type="number">
        <button onclick="pass(${i})">通过</button><button onclick="ref(${i})">驳回</button></p>`;
    })
    document.getElementById('applyBox').innerHTML=ah||'无申请';
    let eh='';
    exchangeData.forEach((it,i)=>{
        eh+=`<p>${it.user}兑换，暂扣${it.cost}
        <button onclick="pe(${i})">通过</button><button onclick="re(${i})">驳回</button></p>`;
    })
    document.getElementById('exchangeBox').innerHTML=eh||'无兑换';
    let th='<table><tr><th>账号</th><th>密码</th><th>余额</th></tr>';
    Object.keys(userData).forEach(k=>th+=`<tr><td>${k}</td><td>${userData[k].pwd}</td><td>${userData[k].money}</td></tr>`);
    document.getElementById('adminAllUser').innerHTML=th+'</table>';
}
function pass(i){
    let num=+document.getElementById('in'+i).value;
    if(!num)return alert('填金额');
    let it=applyData[i];userData[it.user].money+=num;
    addBill(it.user,'in',num,'管理员审批入账');
    applyData.splice(i,1);saveDb();loadAllData();
}
function ref(i){applyData.splice(i,1);saveDb();loadAllData();}
function pe(i){exchangeData.splice(i,1);saveDb();loadAllData();alert('兑换通过');}
function re(i){
    let it=exchangeData[i];userData[it.user].money+=it.cost;
    addBill(it.user,'in',it.cost,'兑换驳回退款');
    exchangeData.splice(i,1);saveDb();loadAllData();alert('钱款退回');
}
function doTransfer(){
    let to=document.getElementById('targetUser').value;
    let num=+document.getElementById('transNum').value;
    if(!num||userData[currUser].money<num)return alert('金额错误或余额不足');
    userData[currUser].money-=num;userData[to].money+=num;
    addBill(currUser,'out',num,'转给'+to);addBill(to,'in',num,'收到转账');
    saveDb();loadAllData();document.getElementById('transNum').value='';alert('转账成功');
}
function logout(){
    currUser='';
    document.getElementById('loginBox').classList.remove('hide');
    document.getElementById('mainBox').classList.add('hide');
    document.getElementById('acc').value='';document.getElementById('pwd').value='';
}
(async ()=>await getDb())();
</script>
</body>
</html>
