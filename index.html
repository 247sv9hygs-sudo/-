<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绷金游戏记账系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:920px;margin:30px auto;padding:20px;background:#f5f7fa}
.box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0001;margin-bottom:15px}
input,button,select{padding:8px 12px;margin:5px;border:1px #ccc solid;border-radius:6px}
button{background:#3671e9;color:white;border:none;cursor:pointer}
.admin{background:#e8f3ff}
.hide{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px #ddd solid;padding:8px;text-align:center}
.redbtn{background:#e64340;}
.fresh-btn{background:#23a957;margin-bottom:8px;}
.in{color:#09943c;font-weight:bold}
.out{color:#e53935;font-weight:bold}
</style>
</head>
<body>
<h2>绷金游戏记账系统</h2>
<div class="box" id="loginBox">
    <h3>登录 / 注册</h3>
    <div>
        <input placeholder="账号" id="acc">
        <input placeholder="密码" type="password" id="pwd">
    </div>
    <button onclick="reg()">注册新账号</button>
    <button onclick="login()">登录</button>
</div>

<div class="box hide" id="mainBox">
    <h3>欢迎：<span id="nowUser"></span> | 当前绷金：<span id="myMoney">0</span></h3>
    <button class="fresh-btn" onclick="loadAllData()">一键刷新申请与余额</button>

    <div class="box">
        <h4>申请增加绷金（填写申请编号+自定义背面核验码，提交等待管理员批复）</h4>
        <input placeholder="填写申请编号" id="applyNo">
        <input placeholder="自由填写背面核验码" id="verifyCode">
        <button onclick="submitApply()">提交充值申请</button>
    </div>

    <div class="box">
        <h4>玩家转账（下拉显示对方余额）</h4>
        <select id="targetUser"></select>
        <input type="number" min="1" placeholder="转账绷金数量" id="transNum">
        <button onclick="doTransfer()">确认转账</button>
    </div>

    <div class="box">
        <h4>礼品兑换：5米（需要1000000绷金）</h4>
        <button class="redbtn" onclick="submitExchange()">申请兑换奖品</button>
        <p>提示：提交兑换立即暂扣绷金，管理员驳回自动原路退回</p>
    </div>

    <div class="box">
        <h4>个人绷金收支明细（绿色入账｜红色出账）</h4>
        <div id="billList"></div>
    </div>

    <div class="box admin hide" id="adminPanel">
        <h4>待处理充值申请（编号+自定义核验码）</h4>
        <div id="applyBox"></div>
        <h4>待处理礼品兑换申请（已暂扣对应绷金）</h4>
        <div id="exchangeBox"></div>
        <h4>全部账号+明文密码+资产一览【仅管理员可见】</h4>
        <div id="adminAllUser"></div>
    </div>
    <button onclick="logout()">退出登录</button>
</div>

<script>
//固定数据库配置
const supabaseUrl = 'https://boyemweepdddbtrcoaujg.supabase.co'
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJveWVtd2VlcGdkYnRyY29hdWpnIiwibmFtZSI6ImFub24iLCJpYXQiOjE3NDU0NzYxMjAsImV4cCI6MjA2MDg0NjEyMH0.SYxQkH5zrYjYjYJQ0nQnQnQnQnQnQnQnQnQnQnQnQ'
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)
let currUser = ''
const NEED_EXCHANGE = 1000000

//注册账号
async function reg(){
    let u = document.getElementById('acc').value.trim()
    let p = document.getElementById('pwd').value.trim()
    if(!u||!p) return alert('账号密码不能为空')
    const {data:uInfo} = await supabase.from('users').select('username').eq('username',u).single()
    if(uInfo) return alert('账号已注册')
    await supabase.from('users').insert([{username:u,password:p,balance:0,is_admin:u==='admin'}])
    alert('注册成功')
}

//登录
async function login(){
    let u = document.getElementById('acc').value.trim()
    let p = document.getElementById('pwd').value.trim()
    const {data:uInfo} = await supabase.from('users').select('*').eq('username',u).single()
    if(!uInfo || uInfo.password !== p) return alert('账号密码错误')
    currUser = u
    document.getElementById('loginBox').classList.add('hide')
    document.getElementById('mainBox').classList.remove('hide')
    loadAllData()
}

//刷新全部数据
async function loadAllData(){
    const {data:userList}=await supabase.from('users').select('*')
    const {data:applyList}=await supabase.from('apply_list').select('*').order('created_at',{asc:false})
    const {data:exList}=await supabase.from('prize_apply').select('*')
    const {data:billList}=await supabase.from('transfer_log').select('*').order('created_at',{asc:false})
    const my = userList.find(i=>i.username===currUser)
    document.getElementById('nowUser').innerText=currUser
    document.getElementById('myMoney').innerText=my.balance

    //转账下拉
    let sel=document.getElementById('targetUser');sel.innerHTML=''
    userList.forEach(i=>{
        if(i.username!==currUser){
            let op=document.createElement('option')
            op.textContent=`${i.username}(${i.balance}绷金)`
            op.value=i.username;sel.appendChild(op)
        }
    })

    //个人账单
    let billHtml=''
    billList.filter(d=>d.from_user===currUser||d.to_user===currUser).forEach(d=>{
        let cls=d.to_user===currUser?'in':'out',sym=d.to_user===currUser?'+':'-'
        let desc=d.to_user===currUser?`收到${d.from_user}转账`:`转给${d.to_user}`
        billHtml+=`<p class="${cls}">${new Date(d.created_at).toLocaleString()}|${desc}|${sym}${d.money}</p>`
    })
    document.getElementById('billList').innerHTML=billHtml||'暂无记录'

    //管理员面板
    if(my.is_admin){
        document.getElementById('adminPanel').classList.remove('hide')
        renderAdmin(userList,applyList,exList)
    }else document.getElementById('adminPanel').classList.add('hide')
}

//提交充值申请
async function submitApply(){
    let no=document.getElementById('applyNo').value.trim()
    let code=document.getElementById('verifyCode').value.trim()
    if(!no||!code)return alert('信息必填')
    await supabase.from('apply_list').insert([{user_name:currUser,check_code:no,verify:code}])
    document.getElementById('applyNo').value='';document.getElementById('verifyCode').value=''
    alert('申请提交')
}

//兑换申请
async function submitExchange(){
    const {data:me}=await supabase.from('users').select('balance').eq('username',currUser).single()
    if(me.balance<NEED_EXCHANGE) return alert('绷金不足')
    await supabase.from('users').update({balance:me.balance-NEED_EXCHANGE}).eq('username',currUser)
    await supabase.from('prize_apply').insert([{user_name:currUser,cost:NEED_EXCHANGE}])
    alert('兑换提交，资金暂扣');loadAllData()
}

//管理员渲染
function renderAdmin(userList,applyList,exList){
    let apHtml=''
    applyList.forEach((item,idx)=>{
        apHtml+=`<p>申请人${item.user_name},编号${item.check_code},核验${item.verify}
        <input id="num${idx}" placeholder="输入绷金">
        <button onclick="passAp('${item.id}',${idx})">通过</button>
        <button onclick="delAp('${item.id}')">驳回</button></p>`
    })
    document.getElementById('applyBox').innerHTML=apHtml||'无申请'

    let exHtml=''
    exList.forEach(item=>{
        exHtml+=`<p>${item.user_name}兑换(扣${item.cost})
        <button onclick="passEx('${item.id}')">通过</button>
        <button onclick="backEx('${item.id}',${item.cost},'${item.user_name}')">驳回退款</button></p>`
    })
    document.getElementById('exchangeBox').innerHTML=exHtml||'无兑换'

    let userTab='<table><tr><th>账号</th><th>密码</th><th>余额</th></tr>'
    userList.forEach(u=>userTab+=`<tr><td>${u.username}</td><td>${u.password}</td><td>${u.balance}</td></tr>`)
    userTab+='</table>'
    document.getElementById('adminAllUser').innerHTML=userTab
}

//审批充值
async function passAp(id,idx){
    let add=+document.getElementById(`num${idx}`).value
    if(!add)return alert('填金额')
    const {data:info}=await supabase.from('apply_list').select('user_name').eq('id',id).single()
    const {data:u}=await supabase.from('users').select('balance').eq('username',info.user_name).single()
    await supabase.from('users').update({balance:u.balance+add}).eq('username',info.user_name)
    await supabase.from('apply_list').delete().eq('id',id);loadAllData()
}
async function delAp(id){await supabase.from('apply_list').delete().eq('id',id);loadAllData()}

//兑换审批
async function passEx(id){await supabase.from('prize_apply').delete().eq('id',id);loadAllData()}
async function backEx(id,money,uname){
    const {data:u}=await supabase.from('users').select('balance').eq('username',uname).single()
    await supabase.from('users').update({balance:u.balance+money}).eq('username',uname)
    await supabase.from('prize_apply').delete().eq('id',id);loadAllData()
}

//转账
async function doTransfer(){
    let to=document.getElementById('targetUser').value
    let num=+document.getElementById('transNum').value
    const {data:me}=await supabase.from('users').select('balance').eq('username',currUser).single()
    if(!num||me.balance<num)return alert('余额不足')
    const {data:target}=await supabase.from('users').select('balance').eq('username',to).single()
    await supabase.from('users').update({balance:me.balance-num}).eq('username',currUser)
    await supabase.from('users').update({balance:target.balance+num}).eq('username',to)
    await supabase.from('transfer_log').insert([{from_user:currUser,to_user:to,money:num}])
    document.getElementById('transNum').value='';alert('转账成功');loadAllData()
}

function logout(){
    currUser='';document.getElementById('loginBox').classList.remove('hide')
    document.getElementById('mainBox').classList.add('hide')
    document.getElementById('acc').value='';document.getElementById('pwd').value=''
}
</script>
</body>
</html>
