<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绷金游戏记账系统</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:920px;margin:30px auto;padding:20px;background:#f5f7fa}
.box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0001;margin-bottom:15px}
input,button,select{padding:8px 12px;margin:5px;border:1px #ccc solid;border-radius:6px}
button{background:#3671e9;color:white;border:none;cursor:pointer}
.admin{background:#e8f3ff}
.hide{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px #ddd solid;padding:8px;text-align:center}
.redbtn{background:#e64340;}
.fresh-btn{background:#23a957;margin-bottom:8px;}
.in{color:#09943c;font-weight:bold}
.out{color:#e53935;font-weight:bold}
</style>
</head>
<body>
<h2>绷金游戏记账系统</h2>
<div class="box" id="loginBox">
    <h3>登录 / 注册</h3>
    <div>
        <input placeholder="账号" id="acc">
        <input placeholder="密码" type="password" id="pwd">
    </div>
    <button onclick="login()">登录</button>
    <button onclick="reg()">注册新账号</button>
</div>

<div class="box hide" id="mainBox">
    <h3>欢迎：<span id="nowUser"></span> | 当前绷金：<span id="myMoney">0</span></h3>
    <button class="fresh-btn" onclick="loadAllData()">一键刷新申请与余额</button>

    <div class="box">
        <h4>申请增加绷金（填写申请编号+自定义背面核验码，提交等待管理员批复）</h4>
        <input placeholder="填写申请编号" id="applyNo">
        <input placeholder="自由填写背面核验码" id="verifyCode">
        <button onclick="submitApply()">提交充值申请</button>
    </div>

    <div class="box">
        <h4>玩家转账（下拉显示对方余额）</h4>
        <select id="targetUser"></select>
        <input type="number" min="1" placeholder="转账绷金数量" id="transNum">
        <button onclick="doTransfer()">确认转账</button>
    </div>

    <div class="box">
        <h4>礼品兑换：5米（需要1000000绷金）</h4>
        <button class="redbtn" onclick="submitExchange()">申请兑换奖品</button>
        <p>提示：提交兑换立即暂扣绷金，管理员驳回自动原路退回</p>
    </div>

    <!--普通用户：全体玩家余额区域清空不展示-->
    <div class="box hide" id="allUserBox">
        <h4>全体玩家实时余额清单</h4>
        <div id="allUserTable"></div>
    </div>

    <div class="box">
        <h4>个人绷金收支明细（绿色入账｜红色出账）</h4>
        <div id="billList"></div>
    </div>

    <div class="box admin hide" id="adminPanel">
        <h4>待处理充值申请（编号+自定义核验码）</h4>
        <div id="applyBox"></div>
        <h4>待处理礼品兑换申请（已暂扣对应绷金）</h4>
        <div id="exchangeBox"></div>
        <h4>全部账号+明文密码+资产一览【仅管理员可见】</h4>
        <div id="adminAllUser"></div>
    </div>
    <button onclick="logout()">退出登录</button>
</div>

<script>
let userData = JSON.parse(localStorage.getItem('bengUser')) || {admin:{pwd:'123456',money:0}};
let applyData = JSON.parse(localStorage.getItem('bengApply')) || [];
let exchangeData = JSON.parse(localStorage.getItem('bengExchange')) || [];
let billLog = JSON.parse(localStorage.getItem('bengBill')) || [];
let currUser = '';
const NEED_EXCHANGE = 1000000;

function saveAll(){
    localStorage.setItem('bengUser',JSON.stringify(userData));
    localStorage.setItem('bengApply',JSON.stringify(applyData));
    localStorage.setItem('bengExchange',JSON.stringify(exchangeData));
    localStorage.setItem('bengBill',JSON.stringify(billLog));
}

function addBill(name,type,money,desc){
    let time=new Date().toLocaleString();
    billLog.push({user:name,type,num:money,info:desc,time});
    saveAll();
}

function reg(){
    let u = document.getElementById('acc').value.trim();
    let p = document.getElementById('pwd').value.trim();
    if(!u||!p)return alert('账号密码不能为空');
    if(userData[u])return alert('账号已存在');
    userData[u]={pwd:p,money:0};saveAll();alert('注册成功');
}

function login(){
    let u = document.getElementById('acc').value.trim();
    let p = document.getElementById('pwd').value.trim();
    if(!userData[u]||userData[u].pwd!==p)return alert('账号或密码错误');
    currUser = u;
    document.getElementById('loginBox').classList.add('hide');
    document.getElementById('mainBox').classList.remove('hide');
    loadAllData();
}

function loadAllData(){
    userData = JSON.parse(localStorage.getItem('bengUser'))||{admin:{pwd:'123456',money:0}};
    applyData = JSON.parse(localStorage.getItem('bengApply'))||[];
    exchangeData = JSON.parse(localStorage.getItem('bengExchange'))||[];
    billLog = JSON.parse(localStorage.getItem('bengBill'))||[];

    document.getElementById('nowUser').innerText = currUser;
    document.getElementById('myMoney').innerText = userData[currUser].money;

    //转账下拉正常显示对方名称+余额
    let sel = document.getElementById('targetUser');
    sel.innerHTML='';
    Object.keys(userData).forEach(name=>{
        if(name!==currUser){
            let opt = document.createElement('option');
            opt.textContent = `${name}（${userData[name].money}绷金）`;
            opt.value = name;
            sel.appendChild(opt);
        }
    })

    //普通用户页面隐藏全体余额表格
    document.getElementById('allUserBox').classList.add('hide');

    //个人明细
    let billHtml='';
    let myBill=billLog.filter(item=>item.user===currUser).reverse();
    if(myBill.length===0) billHtml='暂无收支记录';
    myBill.forEach(d=>{
        let cls=d.type==='in'?'in':'out';
        let symbol=d.type==='in'?'+':'-';
        billHtml+=`<p class="${cls}">${d.time}｜${d.info}｜${symbol}${d.num}绷金</p>`;
    })
    document.getElementById('billList').innerHTML=billHtml;

    //仅管理员打开管理面板查看全账号密码
    if(currUser==='admin'){
        document.getElementById('adminPanel').classList.remove('hide');
        renderAdmin();
    }else{
        document.getElementById('adminPanel').classList.add('hide');
    }
}

//自由填核验码，非空即可提交
function submitApply(){
    let no = document.getElementById('applyNo').value.trim();
    let code = document.getElementById('verifyCode').value.trim();
    if(!no)return alert('必须填写申请编号！');
    if(!code)return alert('背面核验码不能为空！');
    applyData.push({user:currUser,code:no,verify:code,id:Date.now()});
    saveAll();
    document.getElementById('applyNo').value='';
    document.getElementById('verifyCode').value='';
    alert('充值申请提交成功，管理员点【一键刷新】即可看到');
}

function submitExchange(){
    let own = userData[currUser].money;
    if(own<NEED_EXCHANGE){
        alert(`绷金不足，无法兑换！现有${own}，需要${NEED_EXCHANGE}`);
        return;
    }
    userData[currUser].money -= NEED_EXCHANGE;
    addBill(currUser,'out',NEED_EXCHANGE,'申请兑换5米，绷金临时暂扣');
    exchangeData.push({user:currUser,cost:NEED_EXCHANGE,id:Date.now()});
    saveAll();
    loadAllData();
    alert('兑换申请已提交，绷金临时暂扣；管理员驳回将自动退回');
}

function renderAdmin(){
    let applyHtml = '';
    applyData.forEach((item,idx)=>{
        applyHtml += `<p>申请人：${item.user}｜申请编号：${item.code}｜自定义核验码：${item.verify}
        <input id="addNum${idx}" placeholder="输入批复绷金数额" type="number" min="1">
        <button onclick="passApply(${idx})">审核通过</button>
        <button onclick="refuseApply(${idx})">驳回</button>
        </p>`;
    })
    document.getElementById('applyBox').innerHTML = applyHtml||'暂无充值申请';

    let exHtml = '';
    exchangeData.forEach((item,idx)=>{
        exHtml += `<p>${item.user}申请兑换5米（已暂扣${item.cost}绷金）
        <button onclick="passEx(${idx})">审核通过(奖品发放，钱不退回)</button>
        <button onclick="refuseEx(${idx})">驳回(绷金原路返还)</button>
        </p>`;
    })
    document.getElementById('exchangeBox').innerHTML = exHtml||'暂无兑换申请';

    //管理员独有：全部账号+明文密码+余额
    let uHtml = '<table><tr><th>账号</th><th>登录密码</th><th>绷金余额</th></tr>';
    Object.keys(userData).forEach(n=>{
        uHtml+=`<tr><td>${n}</td><td>${userData[n].pwd}</td><td>${userData[n].money}</td></tr>`;
    })
    uHtml+='</table>';
    document.getElementById('adminAllUser').innerHTML=uHtml;
}

function passApply(idx){
    let add = +document.getElementById(`addNum${idx}`).value;
    if(!add||add<=0)return alert('请填写有效绷金数额');
    let info = applyData[idx];
    userData[info.user].money += add;
    addBill(info.user,'in',add,`管理员审批充值入账，申请编号：${info.code}，核验码：${info.verify}`);
    applyData.splice(idx,1);
    saveAll();
    loadAllData();
}
function refuseApply(idx){
    applyData.splice(idx,1);saveAll();loadAllData();
}

function passEx(idx){
    exchangeData.splice(idx,1);
    saveAll();loadAllData();
    alert('兑换审核通过，奖品生效，暂扣绷金不再返还');
}
function refuseEx(idx){
    let info = exchangeData[idx];
    userData[info.user].money += info.cost;
    addBill(info.user,'in',info.cost,'兑换申请驳回，暂扣绷金原路退回');
    exchangeData.splice(idx,1);saveAll();loadAllData();
    alert(`${info.cost}绷金已原路退回`);
}

function doTransfer(){
    let to = document.getElementById('targetUser').value;
    let num = +document.getElementById('transNum').value;
    if(!num||num<=0)return alert('填写正确转账金额');
    if(userData[currUser].money<num)return alert('绷金不足');
    userData[currUser].money -= num;
    userData[to].money += num;
    addBill(currUser,'out',num,`转账给${to}`);
    addBill(to,'in',num,`收到${currUser}转账`);
    saveAll();loadAllData();
    document.getElementById('transNum').value='';
    alert('转账完成');
}

function logout(){
    currUser='';
    document.getElementById('loginBox').classList.remove('hide');
    document.getElementById('mainBox').classList.add('hide');
    document.getElementById('acc').value='';
    document.getElementById('pwd').value='';
}
</script>
</body>
</html>
